# Jobs Ireland with Docker Compose (see docs/EUROPE.md). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# JOBS_IRELAND_PASSWORD (a hash of your password, from `docker run --rm -it
# dossier-europe:local hash-password`) and JOBS_IRELAND_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dossier
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier -d dossier"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${JOBS_IRELAND_IMAGE:-dossier-europe:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD}@db:5432/dossier
      JOBS_IRELAND_PASSWORD: ${JOBS_IRELAND_PASSWORD:?Set JOBS_IRELAND_PASSWORD in .env to a hash from hash-password}
      JOBS_IRELAND_SECRET: ${JOBS_IRELAND_SECRET:?Set JOBS_IRELAND_SECRET in .env}
      JOBS_IRELAND_BACKUP_RETENTION_DAYS: ${JOBS_IRELAND_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      JOBS_IRELAND_AI_PROVIDER: ${JOBS_IRELAND_AI_PROVIDER:-}
      JOBS_IRELAND_AI_URL: ${JOBS_IRELAND_AI_URL:-}
      JOBS_IRELAND_AI_MODEL: ${JOBS_IRELAND_AI_MODEL:-}
      JOBS_IRELAND_AI_KEY: ${JOBS_IRELAND_AI_KEY:-}
      JOBS_IRELAND_AI_TIMEOUT_SECONDS: ${JOBS_IRELAND_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, Jobs Ireland asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      JOBS_IRELAND_TELEMETRY: ${JOBS_IRELAND_TELEMETRY:-}
      # Defaults for Settings → Job search.
      JOBS_IRELAND_JOBS_SOURCE: ${JOBS_IRELAND_JOBS_SOURCE:-}
      JOBS_IRELAND_JSEARCH_KEY: ${JOBS_IRELAND_JSEARCH_KEY:-}
      JOBS_IRELAND_JSEARCH_HOST: ${JOBS_IRELAND_JSEARCH_HOST:-}
      JOBS_IRELAND_ADZUNA_APP_ID: ${JOBS_IRELAND_ADZUNA_APP_ID:-}
      JOBS_IRELAND_ADZUNA_KEY: ${JOBS_IRELAND_ADZUNA_KEY:-}
      JOBS_IRELAND_FREEHIRE_URL: ${JOBS_IRELAND_FREEHIRE_URL:-}
      JOBS_IRELAND_JOBS_ARBEITSAGENTUR: ${JOBS_IRELAND_JOBS_ARBEITSAGENTUR:-}
      # Defaults for Settings → Scoring: ai or jev (Jev by TypeSafe, with its key).
      JOBS_IRELAND_SCORER: ${JOBS_IRELAND_SCORER:-}
      JOBS_IRELAND_TYPESAFE_KEY: ${JOBS_IRELAND_TYPESAFE_KEY:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      JOBS_IRELAND_GOOGLE_CLIENT_ID: ${JOBS_IRELAND_GOOGLE_CLIENT_ID:-}
      JOBS_IRELAND_GOOGLE_CLIENT_SECRET: ${JOBS_IRELAND_GOOGLE_CLIENT_SECRET:-}
      # The address Jobs Ireland is reached at, for Google's redirect.
      JOBS_IRELAND_PUBLIC_URL: ${JOBS_IRELAND_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${JOBS_IRELAND_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). Jobs Ireland reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
